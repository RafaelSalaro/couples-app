name: Web
on:
  push:
    branches: [main]
    paths: ["web/**", "content/legal/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "content/legal/**", ".github/workflows/web.yml"]
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        working-directory: web
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "Website not scaffolded yet (WP-W1)."
          fi
